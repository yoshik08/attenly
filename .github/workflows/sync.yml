# .github/workflows/sync.yml — cloud attendance sync every 5 minutes.
# Hits /api/sync with CRON_SECRET; the endpoint decrypts each user's ERP
# creds server-side, logs in with the auto-captcha solver, and stores the
# latest attendance + timetable in Atlas. The app then loads instantly.

name: attenly-cloud-sync
# schedule-keepalive: re-registers the 5-min cron with github's scheduler

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: trigger cloud sync
        run: |
          code=$(curl -s -o /tmp/sync.json -w "%{http_code}" -X POST \
            "https://attenly-pi.vercel.app/api/sync" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 540)
          echo "http=$code"
          head -c 2000 /tmp/sync.json; echo
          test "$code" = "200"
